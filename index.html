<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIDasGIF</title>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

  <header>
    <h1>PIDasGIF</h1>
    <p>Create an animated GIF to simulate a passenger information display.</p>
  </header>

  <main>
    <div class="section">
      <div class="section-title">Edit the display</div>
      <div id="displaySection">
        <div id="wrapperScroll">
          <canvas id="preview"></canvas>
        </div>

        <div id="rowControls">
          <div class="rowControl" data-row="1">
            <div class="rowControlTop">
              <span class="rowLabel">Row&nbsp;1</span>
              <div class="modeToggle">
                <label class="modeOption"><input type="radio" id="departure1" name="line_one" value="departure" checked><span>Departure</span></label>
                <label class="modeOption"><input type="radio" id="textRow1" name="line_one" value="textRow"><span>Text</span></label>
              </div>
              <div class="sizeControl">Size <input type="number" id="fontSize1" value="64" min="0" max="400"></div>
            </div>
            <div class="fields" data-mode="departure">
              <input type="text" id="line1" value="8" placeholder="Line" class="field-sm">
              <input type="text" id="dest1" value="Elsa-Br&#228;ndstr&#246;m-Str." placeholder="Destination" class="field-fill">
              <input type="text" id="time1" value="sofort" placeholder="Time" class="field-sm">
            </div>
            <div class="fields" data-mode="textRow" hidden>
              <input type="text" id="textContent1" value="" placeholder="Text" class="field-fill">
            </div>
          </div>

          <div class="rowControl" data-row="2">
            <div class="rowControlTop">
              <span class="rowLabel">Row&nbsp;2</span>
              <div class="modeToggle">
                <label class="modeOption"><input type="radio" id="departure2" name="line_two" value="departure" checked><span>Departure</span></label>
                <label class="modeOption"><input type="radio" id="textRow2" name="line_two" value="textRow"><span>Text</span></label>
              </div>
              <div class="sizeControl">Size <input type="number" id="fontSize2" value="64" min="0" max="400"></div>
            </div>
            <div class="fields" data-mode="departure">
              <input type="text" id="line2" value="351" placeholder="Line" class="field-sm">
              <input type="text" id="dest2" value="Starpark" placeholder="Destination" class="field-fill">
              <input type="text" id="time2" value="2 min" placeholder="Time" class="field-sm">
            </div>
            <div class="fields" data-mode="textRow" hidden>
              <input type="text" id="textContent2" value="" placeholder="Text" class="field-fill">
            </div>
          </div>

          <div class="rowControl" data-row="3">
            <div class="rowControlTop">
              <span class="rowLabel">Row&nbsp;3</span>
              <div class="modeToggle">
                <label class="modeOption"><input type="radio" id="departure3" name="line_three" value="departure" checked><span>Departure</span></label>
                <label class="modeOption"><input type="radio" id="textRow3" name="line_three" value="textRow"><span>Text</span></label>
              </div>
              <div class="sizeControl">Size <input type="number" id="fontSize3" value="64" min="0" max="400"></div>
            </div>
            <div class="fields" data-mode="departure">
              <input type="text" id="line3" value="34" placeholder="Line" class="field-sm">
              <input type="text" id="dest3" value="Heide-Uniklinikum" placeholder="Destination" class="field-fill">
              <input type="text" id="time3" value="12:32" placeholder="Time" class="field-sm">
            </div>
            <div class="fields" data-mode="textRow" hidden>
              <input type="text" id="textContent3" value="" placeholder="Text" class="field-fill">
            </div>
          </div>

          <div class="rowControl" data-row="4">
            <div class="rowControlTop">
              <span class="rowLabel">Row&nbsp;4</span>
              <div class="modeToggle">
                <label class="modeOption"><input type="radio" id="departure4" name="line_four" value="departure"><span>Departure</span></label>
                <label class="modeOption"><input type="radio" id="textRow4" name="line_four" value="textRow"><span>Text</span></label>
                <label class="modeOption"><input type="radio" id="infoText4" name="line_four" value="infoText" checked><span>Info</span></label>
              </div>
              <div class="sizeControl">Size <input type="number" id="fontSize4" value="64" min="0" max="400"></div>
            </div>
            <div class="fields" data-mode="departure" hidden>
              <input type="text" id="line4" value="5" placeholder="Line" class="field-sm">
              <input type="text" id="dest4" value="Bad D&#252;rrenberg" placeholder="Destination" class="field-fill">
              <input type="text" id="time4" value="12:35" placeholder="Time" class="field-sm">
            </div>
            <div class="fields" data-mode="textRow" hidden>
              <input type="text" id="textContent4" value="" placeholder="Text" class="field-fill">
            </div>
            <div class="fields" data-mode="infoText">
              <input type="text" id="infoText" value="*** Bauarbeiten im Bereich Marktplatz *** Bauarbeiten im Bereich Marktplatz *** Bauarbeiten im Bereich Marktplatz ***" placeholder="Ticker text" class="field-fill">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Generate animation</div>
      <div id="generateSection">
        <div id="speedControls">
          <div class="speedField">
            <label for="tickerStep">Chars per frame</label>
            <input type="number" id="tickerStep" value="2" min="1" max="20">
          </div>
          <div class="speedField">
            <label for="slider">Frame duration</label>
            <div class="sliderRow">
              <input type="range" min="20" max="3000" step="20" value="200" id="slider" style="width:160px">
              <span id="intervalValue"></span>
            </div>
          </div>
        </div>
        <div id="generateActions">
          <span id="shiftButton">
            <button id="generateTickerBtn" class="primary" onclick="generateTickerAnimation()">&#9889; Generate</button>
          </span>
          <button onclick="window.location.reload(true)">&#8635; Reset</button>
        </div>
      </div>
      <div id="progressContainer">
        <progress id="progressBar" value="0" max="100"></progress>
        <span id="progressText"></span>
      </div>
    </div>

    <div id="gifAnimationContainer" class="section">
      <div class="section-title">Result</div>
      <div id="resultContainer">
        <img id="gifAnimation">
        <div id="gifActions">
          <button onclick="downloadCanvas()">&#128190; Download GIF</button>
          <span class="file-size" id="gifSize"></span>
        </div>
        <div id="video-container">
          <video id="video" controls autoplay loop></video>
        </div>
        <div id="video-download-container">
          <a style="text-decoration: none; color:inherit" id="downloadVideo" download="video.webm">
            <button>&#128190; Download Video</button>
          </a>
          <span class="file-size" id="videoSize"></span>
        </div>
      </div>
    </div>

    <div id="slidesContainer" style="display:none"></div>

  </main>

  <div id="github">
    <a class="nav-link" href="https://github.com/KristjanESPERANTO/PIDasGIF/"><span class="github">View on
        GitHub </span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
        <path
          d="M8 0a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2 .4-2.5-.5-2.7-1 0-.1-.5-.9-.8-1-.3-.2-.7-.6 0-.6.6 0 1 .6 1.2.8.7 1.2 1.9 1 2.4.7 0-.5.2-.9.5-1-1.8-.3-3.7-1-3.7-4 0-.9.3-1.6.8-2.2 0-.2-.3-1 .1-2 0 0 .7-.3 2.2.7a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.5 1.1.2 2 .1 2.1.5.6.8 1.3.8 2.2 0 3-1.9 3.7-3.6 4 .3.2.5.7.5 1.4v2.2c0 .2.1.5.5.4A8 8 0 0 0 16 8a8 8 0 0 0-8-8z" />
      </svg>
    </a>
  </div>

  <script src="./third-party/gif-js/gif.js"></script>
  <script src="./third-party/webm-writer-js/webm-writer-0.3.0.js"></script>
  <script src="./app.js"></script>

</body>

</html>
